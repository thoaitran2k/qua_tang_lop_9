<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Lời Chúc Thầy Cô</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main-content">
      <div id="gift-box">🎁 Nhấn để nhận quà</div>
      <p id="message" class="hidden">
        Đây là những lời chúc mà quý thầy cô dành tặng đến các em
      </p>

      <div id="video-container" class="hidden">
        <video id="myVideo" width="100%" controls>
          <source src="video.mp4" type="video/mp4" />
        </video>
      </div>

      <div id="note-box">
        <h3>🔔 LƯU Ý DỰ THI</h3>
        <p>1. Đừng quên mang Thẻ dự thi!</p>
        <p>2. Đi thi đúng giờ (có mặt trước 30p)!</p>
        <p>3. Nhớ tô đúng Số báo danh và Mã đề (Toán, Anh)!</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
